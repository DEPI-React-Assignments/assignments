<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
    <h2>Change Email Address</h2>

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
        pattern="[A-Za-z]+"
    />

    <br />

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    />

    <br />

    <button type="submit">Change</button>
</form>
</body>
</html>
