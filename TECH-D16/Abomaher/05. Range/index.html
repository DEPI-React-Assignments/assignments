<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Range</title>
        <style>
            main {
                padding: 50px;
            }
            section {
                margin-bottom: 20px;
            }
        </style>
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <section>
                <input type="number" id="numFirst" />
                <input type="range" max="10" id="rangeFirst" />
                <output id="spanOne">5</output>
            </section>
            <section>
                <input type="number" id="numSecond" />
                <input type="range" max="10" id="rangeSecond" />
                <output id="spanTwo">5</output>
            </section>
        </main>
    </body>
</html>
