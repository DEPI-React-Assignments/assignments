<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Audio</title>
        <style>
            main {
                margin-top: 50px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 50px;
            }
            #sectionWrapper {
                background-color: beige;
                width: 70%;
                height: 200px;
                border: 2px solid black;
                display: flex;
                align-items: center;
                justify-content: space-evenly;
            }
            #tracks {
                background-color: rgb(207, 207, 183);
                width: 70%;
                height: auto;
                border: 2px solid black;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-evenly;
            }
            img {
                height: 100%;
            }

            button {
                background-color: beige;
                padding: 10px;
                border: 2px solid black;
            }
            button:hover {
                background-color: rgb(153, 153, 141);
            }
            button:active {
                background-color: rgb(182, 182, 167);
            }
            #tracks > button {
                text-align: right;

                font-size: 2rem;
                height: 80px;
                width: 100%;
            }
            .dark {
                background-color: rgb(223, 223, 177);
            }
        </style>
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <section id="sectionWrapper">
                <img src="Assets/image.jpg" alt="image" />
                <section id="controllerSection">
                    <audio id="audio"></audio>
                    <section>
                        <section>
                            <input
                                type="range"
                                min="0"
                                step="0.1"
                                value="0"
                                name="audioBar"
                                id="audioBar"
                            />
                            <input
                                type="range"
                                min="0"
                                step="0.1"
                                max="1"
                                value="1"
                                name="audioVolume"
                                id="audioVolume"
                            />
                        </section>
                        <button id="play">Play</button>
                        <button id="pause">Pause</button>
                        <button id="replay">Replay</button>
                    </section>
                </section>
            </section>
            <section id="tracks">
                <button id="firstTrack">قف بنا يا صاح نبكي المدن</button>
                <button id="secondTrack" class="dark">
                    يا سواد العين يا روح الجسد
                </button>
                <button id="thirdTrack">وافترقنا فكأنا لم نكن</button>
                <button id="forthTrack" class="dark">
                    قلق أنت فمن ذا أفزعك
                </button>
            </section>
        </main>
    </body>
</html>
