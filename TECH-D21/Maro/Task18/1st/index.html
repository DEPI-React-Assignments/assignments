<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task 1</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="left">
        <h1>Loved</h1>

        <h2>Our service?!</h2>

        <p>Your big family is waiting for you. Join now for our newsletter!</p>

        <span> +201-234-567-890 | hello@www.com </span>
      </div>

      <div class="right">
        <div class="inputs">
          <div class="input-box">
            <label>Full Name</label>

            <input type="text" id="name" placeholder="Joe ..." />
          </div>

          <div class="input-box">
            <label>Email</label>

            <input type="email" id="email" />
          </div>
        </div>

        <div class="comments">
          <label>Comments</label>

          <textarea id="comments"></textarea>
        </div>

        <button id="join">JOIN</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
