<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#eeeeee" />
        <title>Message attachment bar</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="page">
            <form class="message-bar" action="#" method="get">
                <div class="attachment-tools">
                    <button class="tool-button add-button" type="button">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                    <button class="tool-button" type="button">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 3.75h9l5 5v11.5H5z" />
                            <path
                                d="M14 3.75v5h5M7.5 17l3.2-3.6 2.4 2.4 1.7-1.8 2.7 3"
                            />
                            <circle cx="9.2" cy="9.5" r="1.2" />
                        </svg>
                    </button>
                    <button class="tool-button" type="button">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M8 12.5V6a4 4 0 0 1 8 0v11a5 5 0 0 1-10 0V6.5a2 2 0 0 1 4 0V17"
                            />
                        </svg>
                    </button>
                    <button class="tool-button upload-button" type="button">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5"
                            />
                        </svg>
                    </button>
                </div>

                <div class="message-field">
                    <input
                        id="message"
                        name="message"
                        type="text"
                        placeholder="Type your message ..."
                        autocomplete="off"
                    />
                    <button class="emoji-button" type="button">
                        <svg viewBox="0 0 32 32">
                            <circle cx="16" cy="16" r="12.5" />
                            <path
                                d="M11 19c1.2 1.8 2.9 2.7 5 2.7s3.8-.9 5-2.7"
                            />
                            <circle
                                class="emoji-eye"
                                cx="11.8"
                                cy="12.5"
                                r=".9"
                            />
                            <circle
                                class="emoji-eye"
                                cx="20.2"
                                cy="12.5"
                                r=".9"
                            />
                        </svg>
                    </button>
                </div>

                <button class="like-button" type="button">
                    <svg viewBox="0 0 32 32">
                        <path
                            d="M11.5 14.2 16 6.5c.6-1 2.1-.7 2.3.5l.4 4.6h5.1c1.4 0 2.3 1.3 1.8 2.6l-3.1 8.1c-.4 1-1.3 1.6-2.4 1.6h-8.6zM7 13.5h4.5v10.4H7z"
                        />
                    </svg>
                </button>
            </form>
        </main>
    </body>
</html>
