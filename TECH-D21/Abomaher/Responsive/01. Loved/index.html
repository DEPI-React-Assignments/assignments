<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Loved our site</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="page">
            <section class="cardContainer">
                <aside class="left">
                    <h1>Loved</h1>
                    <p class="serviceLine">Our service ?!</p>
                    <p class="message">
                        Your big family is waiting for you, Join now for our
                        newsletter!
                    </p>
                    <p class="contact">+201-234-5678 | Fb://news.com</p>
                </aside>

                <div class="right">
                    <form action="#" method="post">
                        <div class="formRow twoCol">
                            <div class="fieldRow">
                                <label for="name">Full Name</label>
                                <input
                                    id="name"
                                    name="name"
                                    type="text"
                                    placeholder="Joe -"
                                />
                            </div>

                            <div class="fieldRow">
                                <label for="email">Email</label>
                                <input
                                    id="email"
                                    name="email"
                                    type="email"
                                    placeholder=""
                                />
                            </div>
                        </div>

                        <div class="fieldRow textareaField">
                            <label for="comments">Comments</label>
                            <textarea
                                id="comments"
                                name="comments"
                                rows="7"
                            ></textarea>
                        </div>

                        <button type="submit">JOIN</button>
                    </form>
                </div>
            </section>
        </main>
    </body>
</html>
