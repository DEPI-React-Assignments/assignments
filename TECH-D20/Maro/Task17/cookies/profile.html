<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>

<body>

    <h1 id="welcome"></h1>

    <img id="profileImage" width="150">

    <p id="visits"></p>


    <script src="script.js"></script>

    <script>

        var username = getCookie("username");
        var gender = getCookie("gender");
        var color = getCookie("color");

        var visits = getCookie("visits");

        visits = Number(visits) + 1;

        setCookie("visits", visits);


        document.getElementById("welcome").innerHTML =
            "Welcome " + username;


        document.getElementById("visits").innerHTML =
            "You visited this site " + visits + " times";


        document.getElementById("welcome").style.color = color;

        document.getElementById("visits").style.color = color;


        if (gender == "male") {

            document.getElementById("profileImage").src =
                "male.jpg";

        }
        else {

            document.getElementById("profileImage").src =
                "female.jpg";
        }

    </script>

</body>

</html>
