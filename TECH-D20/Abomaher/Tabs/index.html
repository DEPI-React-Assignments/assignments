<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tabs</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="tabs">
            <div class="tab-list">
                <button class="tab is-active" type="button" data-tab="1">
                    Tab 1
                </button>
                <button class="tab" type="button" data-tab="2">Tab 2</button>
                <button class="tab" type="button" data-tab="3">Tab 3</button>
                <button class="tab" type="button" data-tab="4">Tab 4</button>
            </div>
            <section class="tab-panel">Content 1</section>
        </main>

        <script src="node_modules/jquery/dist/jquery.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
