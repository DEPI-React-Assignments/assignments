<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

</head>

<body>

    <h1>Registration</h1>

    <form id="registerForm">

        <label>Username</label>
        <br>

        <input type="text" id="username">

        <br><br>


        <label>Gender</label>
        <br>

        <input
            type="radio"
            name="gender"
            value="male"
        >

        Male

        <br>

        <input
            type="radio"
            name="gender"
            value="female"
        >

        Female

        <br><br>


        <label>Choose your color</label>
        <br>

        <input
            type="color"
            id="userColor"
        >

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>


    <script src="script.js"></script>

</body>

</html>
