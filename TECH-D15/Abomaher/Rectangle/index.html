<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rectangle</title>
    </head>
    <body>
        <h1>Rectangle Information</h1>

        <form id="rectangleForm">
            <label for="width">Width:</label>
            <input id="width" type="number" min="0" step="any" required />

            <br /><br />

            <label for="height">Height:</label>
            <input id="height" type="number" min="0" step="any" required />

            <br /><br />

            <button type="submit">Create Rectangle</button>
        </form>

        <p id="rectangleInfo"></p>

        <script src="script.js"></script>
    </body>
</html>
