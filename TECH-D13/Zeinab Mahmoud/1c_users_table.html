<!DOCTYPE html>
<html>
<head>
    <title>Task 1.c</title>
</head>
<body>
<script>
let number = Number(prompt("Enter the number of persons:"));
let users = [];

for (let i = 0; i < number; i++) {

    let name = prompt("Enter user name:");

    while (name.length <= 3 || name.length >= 10) {
        name = prompt("Name must be more than 3 and less than 10 characters:");
    }

    let age = prompt("Enter user age:");

    while (isNaN(age) || age <= 10 || age >= 60) {
        age = prompt("Age must be greater than 10 and less than 60:");
    }

    users.push({
        name: name,
        age: Number(age)
    });
}

document.write("<table border='1'>");
document.write("<tr><th>Name</th><th>Age</th></tr>");

for (let i = 0; i < users.length; i++) {
    document.write("<tr>");
    document.write("<td>" + users[i].name + "</td>");
    document.write("<td>" + users[i].age + "</td>");
    document.write("</tr>");
}

document.write("</table>");
</script>
</body>
</html>
