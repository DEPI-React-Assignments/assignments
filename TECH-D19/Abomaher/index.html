<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Promises</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: #efefef;
                font-family: Arial, sans-serif;
                color: #333;
            }

            .container {
                max-width: 1120px;
                margin: 0 auto;
                padding: 25px 18px 40px;
            }

            .tabs {
                display: grid;
                grid-template-columns: repeat(5, minmax(120px, 1fr));
                gap: 0;
                background: #c9d8d9;
                border: 1px solid #b9c6c7;
                border-bottom: 0;
                margin-top: 20px;
                overflow: hidden;
            }

            .tab {
                border: 1px solid #c7d3d8;
                background: #a9c6d4;
                color: #0a2d3d;
                padding: 12px 10px;
                font-size: 0.95rem;
                font-weight: 600;
                cursor: pointer;
                transition:
                    background-color 0.2s ease,
                    transform 0.2s ease;
                min-height: 58px;
            }

            .tab.active {
                background: #7ca5b2;
                color: #082e39;
            }

            .tab:hover {
                background: #e4858c;
                transform: translateY(-1px);
            }

            .posts-panel {
                background: #f5f5f5;
                border: 1px solid #d3d3d3;
                border-top: none;
                min-height: 180px;
                padding: 18px 18px 12px;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
            }

            .posts-panel ul {
                margin: 0;
                padding-left: 26px;
            }

            .posts-panel li {
                margin-bottom: 8px;
                line-height: 1.35;
                color: #2a2a2a;
            }

            .status {
                margin-top: 10px;
                color: #d12d2d;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <section class="container">
            <section id="tabs" class="tabs"></section>

            <section class="posts-panel">
                <ul id="postsList"></ul>
            </section>
            <section id="status" class="status"></section>
        </section>

        <script src="script.js"></script>
    </body>
</html>
